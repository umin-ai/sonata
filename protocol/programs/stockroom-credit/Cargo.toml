[package]
name = "stockroom-credit"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "lib"]
name = "stockroom_credit"
[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "demo-oracle/idl-build"]
[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
credit-math.workspace = true
demo-oracle = { path = "../demo-oracle", features = ["cpi"] }
