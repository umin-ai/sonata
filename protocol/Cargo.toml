[workspace]
members = ["programs/*", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "token_2022", "associated_token", "token_2022_extensions"] }
credit-math = { path = "crates/credit-math" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace.metadata.cli]
solana = "3.1.13"
